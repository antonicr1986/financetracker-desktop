name: Release

# Se lanza al subir una etiqueta de version, por ejemplo:
#   git tag v1.0.0 && git push origin v1.0.0
# Publica una Release de GitHub con el ejecutable y el changelog desde la
# version anterior. Mismo modelo que la app Android: lo que se entrega es un
# instalable versionado, no un despliegue.
on:
  push:
    tags:
      - 'v*.*.*'

# Crear la Release necesita escribir en el repo. Solo este workflow lo pide.
permissions:
  contents: write

jobs:
  release:
    name: release
    # WPF solo compila en Windows.
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash, que viene en el runner de Windows: los mismos scripts que
        # en la release de Android.
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          # El historial completo y las etiquetas: el changelog se calcula
          # desde la etiqueta anterior.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Read the version from the tag
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::The tag '$tag' is not of the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

      # Nada se publica si las pruebas fallan.
      - name: Test
        run: dotnet test FinanceTracker.Desktop.slnx --configuration Release

      # Dos formas de entregar lo mismo, las dos con .NET dentro (nada que instalar):
      #
      # - Un .zip con la aplicacion como carpeta normal. Es la recomendada: los
      #   navegadores ponen menos trabas a un .zip que a un .exe suelto, y una
      #   carpeta de archivos normales levanta menos sospechas en Defender que
      #   un ejecutable que se descomprime a si mismo al arrancar.
      # - Un unico .exe, para quien prefiera un solo archivo.
      #
      # La version sale de la etiqueta y queda en las propiedades del archivo
      # (clic derecho > Propiedades > Detalles).
      - name: Publish the app as a folder and zip it
        run: |
          dotnet publish FinanceTracker.Desktop/FinanceTracker.Desktop.csproj \
            --configuration Release --runtime win-x64 --self-contained true \
            -p:DebugType=none \
            -p:Version="$VERSION" \
            --output "publish-folder/FinanceTracker"

      - name: Create the zip
        shell: pwsh
        run: |
          Compress-Archive -Path "publish-folder/FinanceTracker" `
            -DestinationPath "financetracker-desktop-v$env:VERSION-win-x64.zip"

      - name: Publish the single executable
        run: |
          dotnet publish FinanceTracker.Desktop/FinanceTracker.Desktop.csproj \
            --configuration Release --runtime win-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:Version="$VERSION" \
            --output publish-single
          cp publish-single/FinanceTracker.Desktop.exe "financetracker-desktop-v$VERSION-win-x64.exe"

      # Si la version no hubiera llegado a los ejecutables, se veria 1.0.0 en
      # todas las releases. Se comprueba en los dos antes de publicar.
      - name: Verify the version in both executables
        shell: pwsh
        run: |
          $files = @(
            "publish-folder/FinanceTracker/FinanceTracker.Desktop.exe",
            "financetracker-desktop-v$env:VERSION-win-x64.exe"
          )
          foreach ($file in $files) {
            $info = (Get-Item $file).VersionInfo
            echo "$file -> $($info.ProductVersion)"
            if (-not $info.ProductVersion.StartsWith($env:VERSION)) {
              echo "::error::$file reports version '$($info.ProductVersion)', expected '$env:VERSION'"
              exit 1
            }
          }
          foreach ($asset in Get-ChildItem "financetracker-desktop-v$env:VERSION-win-x64.*") {
            echo "$($asset.Name): $([math]::Round($asset.Length / 1MB, 1)) MB"
          }

      # Paquete para Microsoft Store (MSIX, x64 + ARM64). El proyecto de
      # empaquetado solo compila con el MSBuild de Visual Studio, no con
      # "dotnet build"; el runner de Windows lo trae instalado.
      - uses: microsoft/setup-msbuild@v2

      # La version del paquete sale tambien de la etiqueta. MSIX usa cuatro
      # numeros y la Store exige que el ultimo sea 0: v1.2.3 -> 1.2.3.0.
      - name: Set the package version
        shell: pwsh
        run: |
          $file = "FinanceTracker.Desktop.Package/Package.appxmanifest"
          $xml = Get-Content $file -Raw
          $new = [regex]::Replace($xml, '(<Identity[^>]*?Version=")[^"]*(")', "`${1}$env:VERSION.0`${2}")
          if ($new -eq $xml -and -not $xml.Contains("Version=""$env:VERSION.0""")) {
            echo "::error::Could not set the version in $file"
            exit 1
          }
          Set-Content $file $new -NoNewline
          Select-String -Path $file -Pattern '<Identity' -Context 0,3

      # StoreUpload genera el .msixupload que se sube al Partner Center. No se
      # firma: la Store firma el paquete al publicarlo. Sin autoincremento de
      # version (la manda la etiqueta) ni paquete de prueba (necesitaria un
      # certificado).
      - name: Build the Microsoft Store package
        shell: pwsh
        run: |
          msbuild FinanceTracker.Desktop.Package/FinanceTracker.Desktop.Package.wapproj `
            /restore /t:Rebuild /verbosity:minimal `
            /p:Configuration=Release /p:Platform=x64 `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxBundle=Always /p:AppxBundlePlatforms="x64|arm64" `
            /p:AppxAutoIncrementPackageRevision=false `
            /p:GenerateTestArtifacts=false `
            /p:AppxPackageDir="$PWD/msix/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $upload = Get-ChildItem msix -Filter *.msixupload -Recurse | Select-Object -First 1
          if (-not $upload) {
            echo "::error::No .msixupload was produced"
            exit 1
          }
          Copy-Item $upload.FullName "financetracker-desktop-v$env:VERSION-store.msixupload"
          echo "$($upload.Name): $([math]::Round($upload.Length / 1MB, 1)) MB"

      - name: Write the changelog
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## FinanceTracker Desktop $VERSION"
            echo
            echo "### Download"
            echo
            echo "- **\`financetracker-desktop-v$VERSION-win-x64.zip\`** (recommended): unzip it and run \`FinanceTracker.Desktop.exe\` inside the folder."
            echo "- \`financetracker-desktop-v$VERSION-win-x64.exe\`: the same app as a single file."
            echo "- \`financetracker-desktop-v$VERSION-store.msixupload\`: the Microsoft Store package (x64 + ARM64), to upload in Partner Center. Not meant to be installed directly."
            echo
            echo "Windows 10 or 11, 64-bit. Nothing to install: .NET is bundled. Sign in with one click on the demo account, or with your own."
            echo
            echo "### If Windows blocks it"
            echo
            echo "The app is not code-signed and is new, so the browser and Windows SmartScreen may warn. It is expected:"
            echo
            echo "1. **Keep the download.** In Edge: **…** > **Keep** > **Show more** > **Keep anyway**. In Chrome: **Keep**."
            echo "2. **Unblock the file before opening it.** Right-click the \`.zip\` (or the \`.exe\`) > **Properties** > tick **Unblock** > **OK**. Do it on the \`.zip\` *before* extracting, and every file inside comes out unblocked."
            echo "3. If SmartScreen still appears: **More info** > **Run anyway**."
            echo
            if [ -n "$previous" ]; then
              echo "### Changes since $previous"
              range="$previous..$GITHUB_REF_NAME"
            else
              echo "### Changes"
              range="$GITHUB_REF_NAME"
            fi
            echo
            git log "$range" --no-merges --pretty='- %s'
          } > release-notes.md
          cat release-notes.md

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "financetracker-desktop-v$VERSION-win-x64.zip" \
            "financetracker-desktop-v$VERSION-win-x64.exe" \
            "financetracker-desktop-v$VERSION-store.msixupload" \
            --title "FinanceTracker Desktop $VERSION" \
            --notes-file release-notes.md
