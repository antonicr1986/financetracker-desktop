name: Release

# Se lanza al subir una etiqueta de version, por ejemplo:
#   git tag v1.0.0 && git push origin v1.0.0
# Publica una Release de GitHub con el ejecutable y el changelog desde la
# version anterior. Mismo modelo que la app Android: lo que se entrega es un
# instalable versionado, no un despliegue.
on:
  push:
    tags:
      - 'v*.*.*'
  # Paquete de prueba: compila y prueba igual, pero NO crea la Release ni
  # sube nada a la Store. Deja el .msixupload como artefacto del run para
  # subirlo a mano a un "package flight" (solo testers) en Partner Center.
  #   gh workflow run release.yml -f version=1.12.1
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of the test package (MAJOR.MINOR.PATCH, higher than the Store one)'
        required: true

# Crear la Release necesita escribir en el repo. Solo este workflow lo pide.
# Las atestaciones de procedencia y SBOM necesitan ademas:
# - id-token: pedir el certificado de firma a Sigstore con el OIDC del run.
# - attestations y artifact-metadata: guardar la atestacion en el repo.
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: release
    # WPF solo compila en Windows.
    runs-on: windows-latest
    # Publica tres veces (carpeta, exe unico y paquete MSIX x64 + ARM64) y
    # sube el paquete a la Microsoft Store, que tarda en procesarlo.
    timeout-minutes: 60
    env:
      # MSBuild lo lee como propiedad y lo incrusta en el ejecutable para el
      # inicio de sesion con Google (ver GoogleSignIn.cs). No esta en el repo.
      GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
      # ID de la app en la Microsoft Store (es publico: sale en su URL).
      STORE_PRODUCT_ID: 9NT27R8DZ2DQ
    defaults:
      run:
        # Git Bash, que viene en el runner de Windows: los mismos scripts que
        # en la release de Android.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El historial completo y las etiquetas: el changelog se calcula
          # desde la etiqueta anterior.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Read the version from the tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then tag="v$INPUT_VERSION"; fi
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::The tag '$tag' is not of the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

      # Las "Novedades" de la Store, en ingles y en espanol, salen de
      # store/whats-new/. Se comprueban al principio para no compilar nada si
      # faltan: tienen que existir, haber cambiado desde la etiqueta anterior
      # (asi no se publican las de la version pasada) y caber en el limite de
      # la Store (1500 caracteres).
      - name: Check the Store release notes
        if: github.event_name == 'push'
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          for f in store/whats-new/en-us.txt store/whats-new/es-es.txt; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty"
              exit 1
            fi
            # Guardado en ANSI (Windows-1252), las tildes salen como "?" en la Store.
            if ! iconv -f UTF-8 -t UTF-8 "$f" > /dev/null 2>&1; then
              echo "::error::$f is not UTF-8: save it as UTF-8"
              exit 1
            fi
            if [ -n "$previous" ] && git diff --quiet "$previous" "$GITHUB_REF_NAME" -- "$f"; then
              echo "::error::$f has not changed since $previous: write the notes for this version"
              exit 1
            fi
            chars=$(wc -m < "$f")
            if [ "$chars" -gt 1500 ]; then
              echo "::error::$f has $chars characters (Store limit: 1500)"
              exit 1
            fi
          done

      # Nada se publica si las pruebas fallan.
      - name: Test
        run: dotnet test FinanceTracker.Desktop.slnx --configuration Release

      # Dos formas de entregar lo mismo, las dos con .NET dentro (nada que instalar):
      #
      # - Un .zip con la aplicacion como carpeta normal. Es la recomendada: los
      #   navegadores ponen menos trabas a un .zip que a un .exe suelto, y una
      #   carpeta de archivos normales levanta menos sospechas en Defender que
      #   un ejecutable que se descomprime a si mismo al arrancar.
      # - Un unico .exe, para quien prefiera un solo archivo.
      #
      # La version sale de la etiqueta y queda en las propiedades del archivo
      # (clic derecho > Propiedades > Detalles).
      - name: Publish the app as a folder and zip it
        run: |
          dotnet publish FinanceTracker.Desktop/FinanceTracker.Desktop.csproj \
            --configuration Release --runtime win-x64 --self-contained true \
            -p:DebugType=none \
            -p:Version="$VERSION" \
            --output "publish-folder/FinanceTracker"

      - name: Create the zip
        shell: pwsh
        run: |
          Compress-Archive -Path "publish-folder/FinanceTracker" `
            -DestinationPath "financetracker-desktop-v$env:VERSION-win-x64.zip"

      - name: Publish the single executable
        run: |
          dotnet publish FinanceTracker.Desktop/FinanceTracker.Desktop.csproj \
            --configuration Release --runtime win-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:Version="$VERSION" \
            --output publish-single
          cp publish-single/FinanceTracker.Desktop.exe "financetracker-desktop-v$VERSION-win-x64.exe"

      # Si la version no hubiera llegado a los ejecutables, se veria 1.0.0 en
      # todas las releases. Se comprueba en los dos antes de publicar.
      - name: Verify the version in both executables
        shell: pwsh
        run: |
          $files = @(
            "publish-folder/FinanceTracker/FinanceTracker.Desktop.exe",
            "financetracker-desktop-v$env:VERSION-win-x64.exe"
          )
          foreach ($file in $files) {
            $info = (Get-Item $file).VersionInfo
            echo "$file -> $($info.ProductVersion)"
            if (-not $info.ProductVersion.StartsWith($env:VERSION)) {
              echo "::error::$file reports version '$($info.ProductVersion)', expected '$env:VERSION'"
              exit 1
            }
          }
          foreach ($asset in Get-ChildItem "financetracker-desktop-v$env:VERSION-win-x64.*") {
            echo "$($asset.Name): $([math]::Round($asset.Length / 1MB, 1)) MB"
          }

      # Paquete para Microsoft Store (MSIX, x64 + ARM64). El proyecto de
      # empaquetado solo compila con el MSBuild de Visual Studio, no con
      # "dotnet build"; el runner de Windows lo trae instalado.
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # La version del paquete sale tambien de la etiqueta. MSIX usa cuatro
      # numeros y la Store exige que el ultimo sea 0: v1.2.3 -> 1.2.3.0.
      - name: Set the package version
        shell: pwsh
        run: |
          $file = "FinanceTracker.Desktop.Package/Package.appxmanifest"
          $xml = Get-Content $file -Raw
          $new = [regex]::Replace($xml, '(<Identity[^>]*?Version=")[^"]*(")', "`${1}$env:VERSION.0`${2}")
          if ($new -eq $xml -and -not $xml.Contains("Version=""$env:VERSION.0""")) {
            echo "::error::Could not set the version in $file"
            exit 1
          }
          Set-Content $file $new -NoNewline
          Select-String -Path $file -Pattern '<Identity' -Context 0,3

      # StoreUpload genera el .msixupload que se sube al Partner Center. No se
      # firma: la Store firma el paquete al publicarlo. Sin autoincremento de
      # version (la manda la etiqueta) ni paquete de prueba (necesitaria un
      # certificado). /p:Version llega tambien a la app, que la muestra en la
      # pantalla de acceso.
      - name: Build the Microsoft Store package
        shell: pwsh
        run: |
          msbuild FinanceTracker.Desktop.Package/FinanceTracker.Desktop.Package.wapproj `
            /restore /t:Rebuild /verbosity:minimal `
            /p:Configuration=Release /p:Platform=x64 `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxBundle=Always /p:AppxBundlePlatforms="x64|arm64" `
            /p:AppxAutoIncrementPackageRevision=false `
            /p:Version="$env:VERSION" `
            /p:GenerateTestArtifacts=false `
            /p:AppxPackageDir="$PWD/msix/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $upload = Get-ChildItem msix -Filter *.msixupload -Recurse | Select-Object -First 1
          if (-not $upload) {
            echo "::error::No .msixupload was produced"
            exit 1
          }
          Copy-Item $upload.FullName "financetracker-desktop-v$env:VERSION-store.msixupload"
          echo "$($upload.Name): $([math]::Round($upload.Length / 1MB, 1)) MB"

      # SBOM (lista de materiales del software) en formato CycloneDX: los
      # paquetes NuGet que lleva la aplicacion, con version y hash. Se publica
      # junto a los instalables. No incluye el runtime de .NET que va dentro
      # del instalable autocontenido: solo las dependencias del proyecto.
      # La version de la herramienta va fijada para que el SBOM sea reproducible.
      - name: Generate the SBOM
        run: |
          dotnet tool install CycloneDX --version 6.3.1 --tool-path .tools
          ./.tools/dotnet-CycloneDX FinanceTracker.Desktop/FinanceTracker.Desktop.csproj \
            --runtime win-x64 --configuration Release \
            --output-format Json --spec-version 1.6 \
            --set-name FinanceTracker.Desktop --set-version "$VERSION" \
            --output . --filename "financetracker-desktop-v$VERSION-sbom.cdx.json"
          echo "Components: $(grep -c '"bom-ref"' "financetracker-desktop-v$VERSION-sbom.cdx.json")"

      # Atestacion de procedencia (SLSA): firma con Sigstore que demuestra que
      # estos archivos salieron de este workflow, en este repo y de este commit.
      # Cualquiera puede comprobarlo con:
      #   gh attestation verify <archivo> --repo antonicr1986/financetracker-desktop
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            financetracker-desktop-v${{ env.VERSION }}-win-x64.zip
            financetracker-desktop-v${{ env.VERSION }}-win-x64.exe
            financetracker-desktop-v${{ env.VERSION }}-store.msixupload

      # Atestacion del SBOM: une la lista de materiales a los mismos archivos,
      # firmada igual, para que no se pueda cambiar despues sin que se note.
      - name: Attest the SBOM
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            financetracker-desktop-v${{ env.VERSION }}-win-x64.zip
            financetracker-desktop-v${{ env.VERSION }}-win-x64.exe
            financetracker-desktop-v${{ env.VERSION }}-store.msixupload
          sbom-path: financetracker-desktop-v${{ env.VERSION }}-sbom.cdx.json

      # Paquete de prueba: solo el .msixupload, como artefacto (caduca a los 7 dias).
      - name: Upload the test package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: financetracker-desktop-v${{ env.VERSION }}-store-test
          path: financetracker-desktop-v${{ env.VERSION }}-store.msixupload
          retention-days: 7
          if-no-files-found: error

      # A partir de aqui, solo con una etiqueta: Release de GitHub y Store.
      - name: Write the changelog
        if: github.event_name == 'push'
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## FinanceTracker Desktop $VERSION"
            echo
            echo '<details open>'
            echo '<summary><b>🇬🇧 English</b> <sub>· 🇪🇸 Versión en español más abajo</sub></summary>'
            echo
            echo "The easiest way to install it, always up to date and without Windows warnings, is the [Microsoft Store](https://apps.microsoft.com/detail/9NT27R8DZ2DQ). The files below are the same app."
            echo
            echo "### Download"
            echo
            echo "- **\`financetracker-desktop-v$VERSION-win-x64.zip\`** (recommended): unzip it and run \`FinanceTracker.Desktop.exe\` inside the folder."
            echo "- \`financetracker-desktop-v$VERSION-win-x64.exe\`: the same app as a single file."
            echo "- \`financetracker-desktop-v$VERSION-store.msixupload\`: the Microsoft Store package (x64 + ARM64), to upload in Partner Center. Not meant to be installed directly."
            echo "- \`financetracker-desktop-v$VERSION-sbom.cdx.json\`: the SBOM (CycloneDX), the list of packages inside the app."
            echo
            echo "Windows 10 or 11, 64-bit. Nothing to install: .NET is bundled. Sign in with one click on the demo account, or with your own."
            echo
            echo "### If Windows blocks it"
            echo
            echo "The app is not code-signed and is new, so the browser and Windows SmartScreen may warn. It is expected:"
            echo
            echo "1. **Keep the download.** In Edge: **…** > **Keep** > **Show more** > **Keep anyway**. In Chrome: **Keep**."
            echo "2. **Unblock the file before opening it.** Right-click the \`.zip\` (or the \`.exe\`) > **Properties** > tick **Unblock** > **OK**. Do it on the \`.zip\` *before* extracting, and every file inside comes out unblocked."
            echo "3. If SmartScreen still appears: **More info** > **Run anyway**."
            echo
            echo "With Smart App Control turned on, Windows does not let you run it at all: install it from the Microsoft Store instead."
            echo
            echo "### Verify the download"
            echo
            echo "Every file has a signed build provenance attestation: proof that it was built by this repository's release workflow from this tag. With the [GitHub CLI](https://cli.github.com/):"
            echo
            echo '```'
            echo "gh attestation verify financetracker-desktop-v$VERSION-win-x64.zip --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo '</details>'
            echo
            echo '<details>'
            echo '<summary><b>🇪🇸 Español</b></summary>'
            echo
            echo "La forma más fácil de instalarla, siempre actualizada y sin avisos de Windows, es la [Microsoft Store](https://apps.microsoft.com/detail/9NT27R8DZ2DQ). Los archivos de abajo son la misma app."
            echo
            echo "### Descarga"
            echo
            echo "- **\`financetracker-desktop-v$VERSION-win-x64.zip\`** (recomendado): descomprímelo y ejecuta \`FinanceTracker.Desktop.exe\` dentro de la carpeta."
            echo "- \`financetracker-desktop-v$VERSION-win-x64.exe\`: la misma app en un solo archivo."
            echo "- \`financetracker-desktop-v$VERSION-store.msixupload\`: el paquete de la Microsoft Store (x64 + ARM64), para subirlo en Partner Center. No es para instalarlo directamente."
            echo "- \`financetracker-desktop-v$VERSION-sbom.cdx.json\`: el SBOM (CycloneDX), la lista de paquetes que lleva la app."
            echo
            echo "Windows 10 u 11, 64 bits. No hace falta instalar nada: lleva .NET incluido. Entra con un clic en la cuenta demo o con la tuya."
            echo
            echo "### Si Windows la bloquea"
            echo
            echo "La app no está firmada y es nueva, así que el navegador y SmartScreen pueden avisar. Es normal:"
            echo
            echo "1. **Conserva la descarga.** En Edge: **…** > **Conservar** > **Mostrar más** > **Conservar de todos modos**. En Chrome: **Conservar**."
            echo "2. **Desbloquea el archivo antes de abrirlo.** Clic derecho en el \`.zip\` (o el \`.exe\`) > **Propiedades** > marca **Desbloquear** > **Aceptar**. Hazlo en el \`.zip\` *antes* de descomprimir y todo lo de dentro saldrá desbloqueado."
            echo "3. Si aún aparece SmartScreen: **Más información** > **Ejecutar de todas formas**."
            echo
            echo "Con el Control inteligente de aplicaciones (Smart App Control) activado, Windows no deja ejecutarla: instálala desde la Microsoft Store."
            echo
            echo "### Comprobar la descarga"
            echo
            echo "Cada archivo lleva una atestación de procedencia firmada: la prueba de que lo ha compilado el workflow de release de este repositorio a partir de este tag. Con la [CLI de GitHub](https://cli.github.com/):"
            echo
            echo '```'
            echo "gh attestation verify financetracker-desktop-v$VERSION-win-x64.zip --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo '</details>'
            echo
            if [ -n "$previous" ]; then
              echo "## Changes since $previous · Cambios desde $previous"
              range="$previous..$GITHUB_REF_NAME"
            else
              echo "## Changes · Cambios"
              range="$GITHUB_REF_NAME"
            fi
            echo
            git log "$range" --no-merges --pretty='- %s'
          } > release-notes.md
          cat release-notes.md

      - name: Publish the Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "financetracker-desktop-v$VERSION-win-x64.zip" \
            "financetracker-desktop-v$VERSION-win-x64.exe" \
            "financetracker-desktop-v$VERSION-store.msixupload" \
            "financetracker-desktop-v$VERSION-sbom.cdx.json" \
            --title "FinanceTracker Desktop $VERSION" \
            --notes-file release-notes.md

      # --- Microsoft Store ---
      # Va despues de la Release de GitHub: si la Store falla, los instalables
      # ya estan publicados. Se autentica con la app de Entra ID
      # financetracker-store-publisher (rol Manager en Partner Center).
      # Su secreto caduca: renovarlo en Partner Center y en STORE_CLIENT_SECRET.
      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        if: github.event_name == 'push'

      - name: Configure the Microsoft Store CLI
        if: github.event_name == 'push'
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: |
          msstore reconfigure `
            --tenantId $env:STORE_TENANT_ID `
            --sellerId $env:STORE_SELLER_ID `
            --clientId $env:STORE_CLIENT_ID `
            --clientSecret $env:STORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Sube el paquete a un envio nuevo, sin enviarlo todavia (--noCommit):
      # antes hay que poner las Novedades. Se le pasa la ruta del .msixupload
      # directamente: asi la CLI lo trata como paquete MSIX ya hecho y no
      # intenta detectar ni compilar el proyecto.
      # --uploadTimeout: el paquete pesa mas de 100 MB y los 100 s por defecto no bastan.
      - name: Upload the package to the Microsoft Store
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          msstore publish "financetracker-desktop-v$env:VERSION-store.msixupload" `
            --appId $env:STORE_PRODUCT_ID --noCommit --uploadTimeout 1200
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Pone las Novedades de cada idioma en el envio y lo manda a
      # certificacion. "submission update" sustituye el envio entero, asi que
      # se parte del JSON actual y solo se cambian las ReleaseNotes.
      - name: Set the Store release notes and submit
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $output = (msstore submission get $env:STORE_PRODUCT_ID) -join "`n"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # La CLI puede escribir avisos antes del JSON: se queda solo con el JSON.
          $start = $output.IndexOf('{'); $end = $output.LastIndexOf('}')
          if ($start -lt 0 -or $end -le $start) {
            echo "::error::Could not read the submission JSON"
            exit 1
          }
          $submission = $output.Substring($start, $end - $start + 1) | ConvertFrom-Json
          $notes = [ordered]@{ 'en-us' = 'store/whats-new/en-us.txt'; 'es-es' = 'store/whats-new/es-es.txt' }
          foreach ($lang in $notes.Keys) {
            $listing = $submission.Listings.PSObject.Properties |
              Where-Object { $_.Name -ieq $lang } | Select-Object -First 1
            if (-not $listing) {
              echo "::error::The submission has no '$lang' listing"
              exit 1
            }
            $text = (Get-Content -Raw -Encoding utf8 $notes[$lang]).Trim()
            $listing.Value.BaseListing |
              Add-Member -NotePropertyName ReleaseNotes -NotePropertyValue $text -Force
            echo "$lang release notes: $($text.Length) characters"
          }
          $updated = $submission | ConvertTo-Json -Depth 100 -Compress
          msstore submission update $env:STORE_PRODUCT_ID $updated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msstore submission publish $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
