[extend]
useDefault = true

[allowlist]
paths = [
  '''(?i)(^|/)bin/''',
  '''(?i)(^|/)obj/''',
  '''(?i)\.md$''',
  '''(?i)\.example($|\.)''',
]

# Las reglas por defecto detectan claves de proveedores conocidos, pero no una
# credencial escrita a mano en el codigo. En C# la fuga tiene esta forma: un
# campo o constante con el nombre delator y una cadena al lado.
# La contrasena de la cuenta demo es publica a proposito y va marcada con
# "gitleaks:allow" en su propia linea.
[[rules]]
id = "hardcoded-credential-assignment"
description = "Possible credential assigned in source code"
regex = '''(?i)(?:string|var)\s+\w*(?:token|secret|password|apikey|api_key)\w*\s*=\s*"[^"]{8,}"'''
